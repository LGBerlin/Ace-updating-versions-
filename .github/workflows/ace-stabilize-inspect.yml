name: ACE 1.7.2 Voice Hardening
on:
  push:
    paths:
      - '.github/workflows/ace-stabilize-inspect.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add service-to-legacy voice fallback and revalidate syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,re,zlib
          p=Path('updates/1.7.2/Contents/Resources/ACE Bootstrap 1.7.2 stabilization.py')
          src=p.read_text(encoding='utf-8')
          m=re.search(r"JS171=zlib\.decompress\(base64\.b64decode\('([^']+)'\)\)\.decode\('utf-8'\)",src)
          if not m: raise SystemExit('JS payload missing')
          js=zlib.decompress(base64.b64decode(m.group(1))).decode('utf-8')
          old="""            return bestScore>0?best:null;
          }
          function exactUpdateControl(){"""
          new="""            if(bestScore<=0&&root===state.serviceRoot&&state.legacyRoot)return strictVoiceControl(state.legacyRoot);
            return bestScore>0?best:null;
          }
          function exactUpdateControl(){"""
          if old not in js: raise SystemExit('voice fallback anchor missing')
          js=js.replace(old,new,1)
          assert 'root===state.serviceRoot&&state.legacyRoot' in js
          j64=base64.b64encode(zlib.compress(js.encode('utf-8'),9)).decode('ascii')
          src=src[:m.start()]+"JS171=zlib.decompress(base64.b64decode('"+j64+"')).decode('utf-8')"+src[m.end():]
          p.write_text(src,encoding='utf-8')
          Path('/tmp/ace172.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/ace172.js
          python3 -m py_compile "updates/1.7.2/Contents/Resources/ACE Bootstrap 1.7.2 stabilization.py"
          git config user.name "A.C.E. Stabilization"
          git config user.email "actions@users.noreply.github.com"
          git add updates/1.7.2/Contents/Resources/ACE\ Bootstrap\ 1.7.2\ stabilization.py
          git commit -m "Harden A.C.E. 1.7.2 voice service fallback"
          git push
