name: ACE 1.7.2 Post Release Verify
on:
  push:
    paths:
      - '.github/workflows/ace-stabilize-inspect.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published manifest against exact release bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import ast,base64,hashlib,json,plistlib,re,zlib
          latest=json.loads(Path('latest.json').read_text())
          assert latest['version']=='1.7.2'
          assert latest['patch']['base']=='1.7.1'
          source={
            'Contents/Resources/ACE Base 1.6.4.py':Path('updates/1.6.4/Contents/Resources/ACE Bootstrap 1.6.4 integration.py'),
            'Contents/Resources/ACE Base 1.6.5.py':Path('updates/1.6.5/Contents/Resources/ACE Bootstrap 1.6.5 attachments.py'),
            'Contents/Resources/ACE Bootstrap.py':Path('updates/1.7.2/Contents/Resources/ACE Bootstrap 1.7.2 stabilization.py'),
            'Contents/Info.plist':Path('updates/1.7.2/Contents/Info.plist'),
          }
          manifest={x['path']:x for x in latest['patch']['files']}
          assert set(manifest)==set(source)
          for path,p in source.items():
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              print('POST_RELEASE_HASH',path,h,len(p.read_bytes()))
              assert manifest[path]['sha256']==h,(path,manifest[path]['sha256'],h)
              assert manifest[path]['mode']=='644'
          boot=source['Contents/Resources/ACE Bootstrap.py']
          src=boot.read_text();ast.parse(src)
          assert "ace.VERSION='1.7.2'" in src and "['current_version']='1.7.2'" in src
          assert "BASE=H/'ACE Base 1.6.5.py'" in src
          def dec(name):
              m=re.search(name+r"=zlib\.decompress\(base64\.b64decode\('([^']+)'\)\)\.decode\('utf-8'\)",src);assert m
              return zlib.decompress(base64.b64decode(m.group(1))).decode()
          css,js=dec('CSS171'),dec('JS171')
          Path('/tmp/ace172.js').write_text(js)
          assert 'root===state.serviceRoot&&state.legacyRoot' in js
          assert "$('ace171Voice').onclick=()=>activateVoice();" in js
          assert "$('ace171Update').onclick=()=>activateUpdate();" in js
          assert "action('voice')" not in js and "action('update')" not in js
          assert '#ace171LegacyRoot{display:none!important}' in css
          assert '/*ACE172_GREEN_COMPAT*/' in css
          bad=[]
          for line in css.splitlines():
              for hx in re.findall(r'#[0-9a-fA-F]{6}',line):
                  r,g,b=(int(hx[j:j+2],16) for j in (1,3,5))
                  if b>g+22 and b>r+22: bad.append(hx)
          assert not bad,bad[:20]
          logo=base64.b64decode(re.search(r"LOGO_B64='([^']+)'",src).group(1))
          logo_sha=re.search(r"LOGO_SHA='([^']+)'",src).group(1)
          assert hashlib.sha256(logo).hexdigest()==logo_sha
          pl=plistlib.loads(source['Contents/Info.plist'].read_bytes())
          assert pl['CFBundleShortVersionString']=='1.7.2' and pl['CFBundleVersion']=='1.7.2'
          print('ACE_172_POST_RELEASE_MANIFEST_OK')
          PY
          node --check /tmp/ace172.js
          python3 -m py_compile "updates/1.7.2/Contents/Resources/ACE Bootstrap 1.7.2 stabilization.py"
          echo ACE_172_POST_RELEASE_VERIFY_OK
