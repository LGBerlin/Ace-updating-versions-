name: ACE Stabilization Inspect
on:
  push:
    paths:
      - '.github/workflows/ace-stabilize-inspect.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace voice and updater control identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          pats=[
            r"(?:id|class|title|aria-label)=[\\\"'][^\\\"']*(?:voice|speak|speech|tts|update)[^\\\"']*[\\\"']",
            r"\$\([\\\"'][^\\\"']*(?:voice|speak|speech|tts|update)[^\\\"']*[\\\"']\)",
            r"getElementById\([\\\"'][^\\\"']*(?:voice|speak|speech|tts|update)[^\\\"']*[\\\"']\)",
            r"querySelector\([\\\"'][^\\\"']*(?:voice|speak|speech|tts|update)[^\\\"']*[\\\"']\)",
          ]
          for p in sorted(Path('updates').rglob('*.py')):
              s=p.read_text(errors='replace')
              found=[]
              for pat in pats:
                  found += [(m.start(),m.group(0)) for m in re.finditer(pat,s,re.I)]
              if found:
                  print('\n###',p)
                  for pos,val in sorted(set(found)):
                      lo=max(0,pos-500);hi=min(len(s),pos+len(val)+1000)
                      print('\nMATCH',val,'\n',s[lo:hi].replace('\n','\\n'))
          print('\n=== RAW LIKELY IDENTIFIERS ===')
          ids=set()
          for p in Path('updates').rglob('*.py'):
              s=p.read_text(errors='replace')
              for m in re.finditer(r"[A-Za-z_][A-Za-z0-9_-]{2,40}",s):
                  t=m.group(0)
                  if re.search(r'voice|speak|speech|tts|update',t,re.I): ids.add(t)
          print('\n'.join(sorted(ids,key=str.lower)))
          PY
