name: ACE 1.7.2 Verify
on:
  push:
    paths:
      - '.github/workflows/ace-stabilize-inspect.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify candidate and cumulative capabilities
        shell: bash
        run: |
          set -euo pipefail
          echo ' ' | base64 -d > /tmp/verify172.py
          python3 /tmp/verify172.py
          node --check /tmp/ace172.js
          python3 -m py_compile "updates/1.7.2/Contents/Resources/ACE Bootstrap 1.7.2 stabilization.py"
          echo ACE_172_VERIFY_OK
