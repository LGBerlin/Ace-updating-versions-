name: ACE 1.6.2 Package QA
on:
  push:
    paths:
      - 'updates/1.6.2/**'
      - '.github/workflows/ace162-package-qa.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate low-latency research release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import ast,hashlib,plistlib,re
          p=Path('updates/1.6.2/Contents/Resources/ACE Bootstrap 1.6.2 low latency.py')
          s=p.read_text()
          ast.parse(s,filename=str(p));compile(s,str(p),'exec')
          assert "BASE = H / 'ACE Base 1.6.1.py'" in s
          assert "ace.VERSION = '1.6.2'" in s
          for exact in [
              'b161.MIN_SOURCES = 3','b161.TARGET_SOURCES = 4','b161.MAX_SOURCES = 5',
              'b161.DISCOVERY_BUDGET = 1.8','b161.PAGE_BUDGET = 3.0',
              "r159._evidence_block = _compact_evidence_block",
              "b161._fetch_source_fast = _fetch_source_compact",
          ]: assert exact in s, exact
          assert "limit=560" in s
          assert not re.search(r"_patch_file\(.*app\.js",s)
          pl=plistlib.loads(Path('updates/1.6.2/Contents/Info.plist').read_bytes())
          assert pl['CFBundleShortVersionString']=='1.6.2'
          assert pl['CFBundleVersion']=='1.6.2'
          for f in [
              Path('updates/1.6.1/Contents/Resources/ACE Bootstrap 1.6.1 fast research.py'),
              p,
              Path('updates/1.6.2/Contents/Info.plist'),
          ]:
              print('SHA256',f,hashlib.sha256(f.read_bytes()).hexdigest())
          # Verify the compact-evidence policy is dramatically smaller than 1.6.1.
          sources=[{'domain':f's{i}.example','title':'Example title','excerpt':'x'*560} for i in range(1,6)]
          def block(srcs):
              lines=['Cross-check']
              for i,x in enumerate(srcs[:5],1):
                  lines.append(f"S{i} {x['domain']} — {x['title']}")
                  lines.append(x['excerpt'][:560])
              return '\n'.join(lines)
          compact=len(block(sources[:4]))
          old_floor=4*1900
          print('EVIDENCE_CHARS_4_SOURCES',compact,'OLD_EXCERPT_CHARS',old_floor)
          assert compact < old_floor*0.40
          print('ACE162_QA=PASS')
          PY
