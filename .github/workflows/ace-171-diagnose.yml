name: ACE 1.7.1 Diagnose
on:
  push:
    paths:
      - '.github/workflows/ace-171-diagnose.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect 1.7.0 exact wrapper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,zlib
          s=Path('updates/1.7.0/Contents/Resources/ACE Bootstrap 1.7.0 command center.py').read_text()
          m=re.search(r"JS170=zlib\.decompress\(base64\.b64decode\('([^']+)'\)\)\.decode\('utf-8'\)",s)
          js=zlib.decompress(base64.b64decode(m.group(1))).decode()
          print('=== FIRST 1800 ===')
          print(js[:1800])
          print('=== LAST 1600 ===')
          print(js[-1600:])
          PY
