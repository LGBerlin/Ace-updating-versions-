name: ACE 1.7.1 Verify
on:
  push:
    paths:
      - '.github/workflows/ace-171-diagnose.yml'
      - 'updates/1.7.1/**'
      - 'latest.json'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify clean shell and release files
        shell: bash
        run: |
          set -euo pipefail
          BOOT="updates/1.7.1/Contents/Resources/ACE Bootstrap 1.7.1 clean shell.py"
          PLIST="updates/1.7.1/Contents/Info.plist"
          python3 -m py_compile "$BOOT"
          python3 - <<'PY'
          from pathlib import Path
          import ast,base64,hashlib,json,plistlib,re,zlib
          boot=Path('updates/1.7.1/Contents/Resources/ACE Bootstrap 1.7.1 clean shell.py')
          plist=Path('updates/1.7.1/Contents/Info.plist')
          b=boot.read_bytes(); print('SHA256',boot,hashlib.sha256(b).hexdigest(),len(b))
          pb=plist.read_bytes(); print('SHA256',plist,hashlib.sha256(pb).hexdigest(),len(pb))
          src=b.decode(); ast.parse(src)
          required=["BASE=H/'ACE Base 1.6.5.py'","ace.VERSION='1.7.1'",'ACE171_CLEAN_SHELL','ace171-logo.png','LOGO_SHA']
          missing=[x for x in required if x not in src]
          if missing: raise SystemExit('Missing bootstrap anchors '+repr(missing))
          if "ACE Base 1.7.0.py" in src: raise SystemExit('1.7.1 must not load 1.7.0 overlay runtime')
          def dec(name):
              m=re.search(name+r"=zlib\.decompress\(base64\.b64decode\('([^']+)'\)\)\.decode\('utf-8'\)",src)
              if not m: raise SystemExit('Missing compressed '+name)
              return zlib.decompress(base64.b64decode(m.group(1))).decode()
          css,js=dec('CSS171'),dec('JS171')
          for bad in ['currentModeFromOriginal','syncMode()','if(proxy)clickAction(mode)','ace170-stage-live']:
              if bad in js: raise SystemExit('Legacy mode synchronization survived: '+bad)
          for good in ["state={mode:'chat'",'function setMode(mode)','ace171LegacyRoot','mountCore','buildLive','promoteKnownOverlays','ace171-logo.png']:
              if good not in js: raise SystemExit('Missing clean-shell feature '+good)
          if '#ace171LegacyRoot{display:none!important}' not in css: raise SystemExit('Legacy UI is not hard-hidden')
          Path('/tmp/ace171.js').write_text(js)
          # Validate cleanup algorithm against a synthetic persisted 1.7.0 resource.
          def trunc(s,marker,end=None):
              i=s.rfind(marker)
              if i<0:return s
              if end:
                  j=s.find(end,i);return s[:j+len(end)] if j>=0 else s[:i]
              j=s.find('\n',i);return s[:j+1] if j>=0 else s[:i+len(marker)]
          sample='CORE\n// ACE165\n(function(){window.__ACE170_COMMAND_CENTER__=1})();\n// ACE170_COMMAND_CENTER\n'
          cleaned=trunc(sample,'// ACE165')
          assert 'ACE170' not in cleaned and cleaned.endswith('// ACE165\n')
          logo64=re.search(r"LOGO_B64='([^']+)'",src).group(1)
          logo=base64.b64decode(logo64)
          expect=re.search(r"LOGO_SHA='([^']+)'",src).group(1)
          assert hashlib.sha256(logo).hexdigest()==expect
          pl=plistlib.loads(pb);assert pl['CFBundleShortVersionString']=='1.7.1' and pl['CFBundleVersion']=='1.7.1'
          latest=json.loads(Path('latest.json').read_text())
          print('LATEST_DURING_VERIFY',latest.get('version'))
          print('ACE_171_STRUCTURE_OK')
          PY
          node --check /tmp/ace171.js
          echo ACE_171_VERIFY_OK
