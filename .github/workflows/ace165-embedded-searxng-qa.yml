name: ACE 1.6.5 Embedded SearXNG QA

on:
  push:
    paths:
      - 'updates/1.6.5/**'
      - '.github/workflows/ace165-embedded-searxng-qa.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate embedded SearXNG manager and runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import ast, hashlib, plistlib, re
          root=Path('.')
          mgr=root/'updates/1.6.5/Contents/Resources/ACE SearXNG Manager.py'
          boot=root/'updates/1.6.5/Contents/Resources/ACE Bootstrap 1.6.5 embedded searxng.py'
          base=root/'updates/1.6.4/Contents/Resources/ACE Bootstrap 1.6.4 searxng.py'
          plist=root/'updates/1.6.5/Contents/Info.plist'
          for p in (mgr,boot,base):
              src=p.read_text()
              ast.parse(src, filename=str(p)); compile(src,str(p),'exec')
          ms=mgr.read_text(); bs=boot.read_text()
          assert "PIN = '8f452ee89293d9a752a776f4c33f5a5f124fff97'" in ms
          assert "PACKAGE_URL = f'https://github.com/searxng/searxng/archive/{PIN}.tar.gz'" in ms
          assert "LOCAL_URL = 'http://127.0.0.1:8888'" in ms
          assert "SEARXNG_SETTINGS_PATH" in ms
          assert "'-m', 'searx.webapp'" in ms
          assert "'/config'" in ms
          assert "pip', 'install'" in ms
          assert "BASE = H / 'ACE Base 1.6.4.py'" in bs
          assert "MANAGER = H / 'ACE SearXNG Manager.py'" in bs
          assert "ace.VERSION = '1.6.5'" in bs
          assert "sx.ensure_started_async()" in bs
          assert "b164._candidate_instances = _managed_candidates" in bs
          pl=plistlib.loads(plist.read_bytes())
          assert pl['CFBundleShortVersionString']=='1.6.5'
          assert pl['CFBundleVersion']=='1.6.5'
          for p in (base,mgr,boot,plist):
              print('SHA256',p,hashlib.sha256(p.read_bytes()).hexdigest())
          print('STATIC_QA=PASS')
          PY

          PIN=8f452ee89293d9a752a776f4c33f5a5f124fff97
          rm -rf /tmp/ace165-venv /tmp/ace165-settings.yml /tmp/ace165-searx.log
          python3 -m venv /tmp/ace165-venv
          PIP_DISABLE_PIP_VERSION_CHECK=1 /tmp/ace165-venv/bin/python -m pip install --prefer-binary --no-input "https://github.com/searxng/searxng/archive/${PIN}.tar.gz"
          /tmp/ace165-venv/bin/python - <<'PY'
          import searx
          print('SEARX_IMPORT=PASS', searx.__file__)
          PY
          cat >/tmp/ace165-settings.yml <<'YAML'
          use_default_settings: true
          general:
            debug: false
            instance_name: "A.C.E. Search QA"
            enable_metrics: false
          search:
            safe_search: 0
            autocomplete: ""
            formats:
              - html
              - json
          server:
            bind_address: "127.0.0.1"
            port: 8888
            secret_key: "ace165-qa-not-production"
            limiter: false
            public_instance: false
            image_proxy: false
          valkey:
            url: false
          outgoing:
            request_timeout: 2.0
            max_request_timeout: 3.0
            enable_http2: true
          YAML
          SEARXNG_SETTINGS_PATH=/tmp/ace165-settings.yml \
          SEARXNG_BIND_ADDRESS=127.0.0.1 SEARXNG_PORT=8888 \
          SEARXNG_LIMITER=false SEARXNG_PUBLIC_INSTANCE=false \
          /tmp/ace165-venv/bin/python -m searx.webapp >/tmp/ace165-searx.log 2>&1 &
          SX_PID=$!
          trap 'kill $SX_PID 2>/dev/null || true' EXIT
          ready=0
          for _i in $(seq 1 50); do
            if curl -fsS --max-time 1 http://127.0.0.1:8888/config >/tmp/ace165-config.json; then
              ready=1; break
            fi
            if ! kill -0 $SX_PID 2>/dev/null; then
              echo 'SearXNG exited during startup'; cat /tmp/ace165-searx.log; exit 1
            fi
            sleep 0.3
          done
          if [ "$ready" != "1" ]; then
            echo 'SearXNG failed health check'; cat /tmp/ace165-searx.log; exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ace165-config.json'))
          assert isinstance(d,dict) and isinstance(d.get('engines'),list) and d['engines']
          print('SEARX_CONFIG_HEALTH=PASS',len(d['engines']))
          PY
          curl -fsS --max-time 8 'http://127.0.0.1:8888/search?q=OpenAI&format=json' >/tmp/ace165-search.json || true
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/ace165-search.json')
          if p.exists() and p.stat().st_size:
              d=json.load(open(p))
              assert isinstance(d,dict) and isinstance(d.get('results'),list)
              print('SEARX_SEARCH_ROUTE=PASS',len(d['results']))
          else:
              print('SEARX_SEARCH_ROUTE=NETWORK_UNAVAILABLE_BUT_SERVICE_HEALTHY')
          PY
          echo 'ACE165_RUNTIME_QA=PASS'
