name: ACE Release Verify
on:
  push:
    paths:
      - '.github/workflows/ace-release-verify.yml'
      - 'updates/1.6.5/**'
      - 'latest.json'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 1.6.5 release files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "updates/1.6.5/Contents/Resources/ACE Bootstrap 1.6.5 attachments.py"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, plistlib, ast, json
          repo = Path('.')
          files = [
              repo/'updates/1.6.5/Contents/Resources/ACE Bootstrap 1.6.5 attachments.py',
              repo/'updates/1.6.5/Contents/Info.plist',
              repo/'updates/1.6.4/Contents/Resources/ACE Bootstrap 1.6.4 integration.py',
          ]
          for p in files:
              b=p.read_bytes()
              print('SHA256', p.as_posix(), hashlib.sha256(b).hexdigest(), len(b))
          src=files[0].read_text(encoding='utf-8')
          ast.parse(src)
          required=[
              "BASE = H / 'ACE Base 1.6.4.py'",
              "ace.VERSION = '1.6.5'",
              "/api/attachments/extract",
              "/api/attachments/vision",
              "docx|doc|rtf|pptx|xlsx|pdf",
              "ACE165_ATTACHMENTS",
          ]
          missing=[x for x in required if x not in src]
          if missing: raise SystemExit('Missing 1.6.5 anchors: '+repr(missing))
          pl=plistlib.loads(files[1].read_bytes())
          assert pl['CFBundleShortVersionString']=='1.6.5'
          assert pl['CFBundleVersion']=='1.6.5'
          latest=json.loads((repo/'latest.json').read_text())
          print('LATEST_BEFORE_RELEASE', latest.get('version'))
          print('ACE_RELEASE_VERIFY_OK')
          PY
